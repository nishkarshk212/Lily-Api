<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Lily-Api Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120824"/>
      <stop offset="50%" stop-color="#1E0B36"/>
      <stop offset="100%" stop-color="#0B1938"/>
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E93"/>
      <stop offset="50%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#26A5E4"/>
    </linearGradient>
    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#26A5E4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FF2E93" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF2E93" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="82%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#26A5E4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#26A5E4" stop-opacity="0"/>
    </radialGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="900" height="240" rx="18" ry="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- Background -->
    <rect width="900" height="240" fill="url(#bgGrad)"/>
    <rect width="900" height="240" fill="url(#glowPink)"/>
    <rect width="900" height="240" fill="url(#glowBlue)"/>

    <!-- Animated Neon Wave Layers -->
    <path fill="url(#waveGrad1)" opacity="0.35">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M0,155 Q225,115 450,155 T900,145 L900,240 L0,240 Z;
                M0,140 Q225,180 450,135 T900,160 L900,240 L0,240 Z;
                M0,165 Q225,125 450,160 T900,135 L900,240 L0,240 Z;
                M0,155 Q225,115 450,155 T900,145 L900,240 L0,240 Z"/>
    </path>
    <path fill="url(#waveGrad2)" opacity="0.28">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M0,175 Q225,205 450,165 T900,180 L900,240 L0,240 Z;
                M0,185 Q225,150 450,185 T900,160 L900,240 L0,240 Z;
                M0,165 Q225,195 450,170 T900,190 L900,240 L0,240 Z;
                M0,175 Q225,205 450,165 T900,180 L900,240 L0,240 Z"/>
    </path>

    <!-- Top Accent Border Line -->
    <rect x="0" y="0" width="900" height="4" fill="url(#waveGrad1)"/>

    <!-- Decorative Equalizer Bars (Left) -->
    <g transform="translate(55, 80)" opacity="0.85">
      <rect x="0" y="25" width="6" height="30" rx="3" fill="#FF2E93">
        <animate attributeName="height" values="20;50;25;45;20" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="35;10;30;15;35" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="10" width="6" height="55" rx="3" fill="#C77DFF">
        <animate attributeName="height" values="55;20;60;30;55" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;35;5;25;10" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="20" width="6" height="40" rx="3" fill="#26A5E4">
        <animate attributeName="height" values="30;60;20;50;30" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="25;5;35;12;25" dur="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Decorative Equalizer Bars (Right) -->
    <g transform="translate(809, 80)" opacity="0.85">
      <rect x="0" y="20" width="6" height="40" rx="3" fill="#26A5E4">
        <animate attributeName="height" values="30;60;20;50;30" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="25;5;35;12;25" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="12" y="10" width="6" height="55" rx="3" fill="#C77DFF">
        <animate attributeName="height" values="55;20;60;30;55" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;35;5;25;10" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="25" width="6" height="30" rx="3" fill="#FF2E93">
        <animate attributeName="height" values="20;50;25;45;20" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="35;10;30;15;35" dur="1.3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Main Title -->
    <text x="450" y="96" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="60" font-weight="800" fill="#FFFFFF" filter="url(#textShadow)">
      🌸 Lily-Api
    </text>

    <!-- Subtitle (Properly XML-escaped &amp;) -->
    <text x="450" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="500" fill="#E2D9F3">
      Ultra-Fast Edge YouTube Audio &amp; Video Stream Resolver
    </text>

    <!-- Feature Pill -->
    <rect x="205" y="164" width="490" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
    <text x="450" y="186" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF">
      ⚡ &lt;20ms Edge Cache   •   🚀 100+ MB/s CDN   •   🔞 Age-Gate Ready
    </text>
  </g>
</svg>
